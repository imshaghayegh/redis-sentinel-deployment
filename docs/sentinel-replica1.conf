port 26379
bind 0.0.0.0
supervised systemd
pidfile "/run/redis/redis-sentinel.pid"
logfile "/var/log/redis/sentinel.log"
dir "/var/lib/sentinel"
sentinel myid <Sentinel-Replica-Node1-ID>
sentinel deny-scripts-reconfig yes
sentinel monitor mymaster <master-IP> 6379 2
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 60000
  
# Generated by CONFIG REWRITE
protected-mode no
user default on nopass sanitize-payload ~* resetchannels +@all
sentinel auth-pass mymaster 123456
sentinel config-epoch mymaster 15
sentinel leader-epoch mymaster 15
sentinel known-replica mymaster <Replica-node1-IP> 6379
sentinel known-replica mymaster <Replica-node2-IP> 6379

### If you want to configure Replica Node 1, you have to configure the Master Node and Replica Node 2 in this section.
### If you want to configure the Master Node, you have to configure Replica Node 1 and Replica Node 2 in this section.

sentinel known-sentinel mymaster <Master-IP> 26379 <Sentinel-Master-ID>
sentinel known-sentinel mymaster <Replica-node2-IP> 26379 <Sentinel-Replica-Node2-ID>
sentinel current-epoch 15

latency-tracking-info-percentiles 50 99 99.9
