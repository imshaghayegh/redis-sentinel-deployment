# Create this file in Master Node

bind 0.0.0.0
protected-mode no
port 6379
supervised systemd
daemonize no
pidfile "/var/run/redis/redis-server.pid"
logfile "/var/log/redis/redis.log"
dir "/var/lib/redis"
# Authentication
requirepass "123456"
masterauth "123456"

# Save settings
save 900 1
save 300 10
save 60 10000
dbfilename "dump.rdb"

# Optional performance settings
tcp-backlog 511
tcp-keepalive 300
loglevel notice
rdbcompression yes
rdbchecksum yes
always-show-logo yes

# Generated by CONFIG REWRITE
latency-tracking-info-percentiles 50 99 99.9
user default on sanitize-payload
